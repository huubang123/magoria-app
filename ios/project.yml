# XcodeGen spec — tự động sinh file .xcodeproj từ folder ios/.
# Chạy: xcodegen generate --spec project.yml (trong folder ios/)
name: MagoriaVoiceTest
options:
  bundleIdPrefix: com.magoria
  deploymentTarget:
    iOS: 15.0
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
packages:
  Starscream:
    url: https://github.com/daltoniam/Starscream
    from: 4.0.6
targets:
  MagoriaVoiceTest:
    type: application
    platform: iOS
    sources:
      - path: MagoriaVoiceTest
    dependencies:
      - package: Starscream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magoria.MagoriaVoiceTest
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        # Xcode tự sinh Info.plist từ các key dưới (không cần file Info.plist thật)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Cần mic để nói chuyện với core backend"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Magoria"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
